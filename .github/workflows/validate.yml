name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  javascript:
    name: JavaScript syntax and imports
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for validation only
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find src/js -type f -name '*.js' -print0)

      - name: Validate built-in workflow templates
        run: node scripts/validate-templates.mjs

      - name: Test box library handlers
        run: node scripts/validate-box-library.mjs

      - name: Test in-app notification delivery
        run: node scripts/validate-notifications.mjs

      - name: Test workflow engine execution
        run: node scripts/validate-engine.mjs

      - name: Verify relative imports
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          function collect(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
              const fullPath = path.join(directory, entry.name);
              return entry.isDirectory()
                ? collect(fullPath)
                : fullPath.endsWith('.js') ? [fullPath] : [];
            });
          }

          const files = collect('src/js');
          const missing = [];

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const imports = source.matchAll(/(?:from\\s*|import\\s*)['"]([^'"]+)['"]/g);
            for (const match of imports) {
              if (!match[1].startsWith('.')) continue;
              const target = path.resolve(path.dirname(file), match[1]);
              if (!fs.existsSync(target)) missing.push(`${file}: ${match[1]}`);
            }
          }

          if (missing.length) {
            console.error('Missing relative imports:', missing.join('\\n'));
            process.exit(1);
          }
          console.log(`Verified relative imports in ${files.length} JavaScript files.`);
          NODE
