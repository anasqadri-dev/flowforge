<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FlowForge - A browser-based visual workflow automation platform.">
    <title>FlowForge | Workflow Automation</title>
    <link rel="stylesheet" href="src/css/app-shell.css">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
</head>

<body>
    <!-- Application Sidebar -->
    <aside class="sidebar">
        <h2 class="brand"><i data-lucide="workflow" aria-hidden="true"></i> FlowForge</h2>
        <nav aria-label="Main navigation">
            <a href="#dashboard" class="active"><i data-lucide="layout-dashboard" aria-hidden="true"></i> Dashboard</a>
            <a href="#builder"><i data-lucide="workflow" aria-hidden="true"></i> Builder</a>
            <a href="#runs"><i data-lucide="history" aria-hidden="true"></i> Runs</a>
            <a href="#templates"><i data-lucide="gallery-vertical" aria-hidden="true"></i> Templates</a>
            <a href="#settings"><i data-lucide="settings" aria-hidden="true"></i> Settings</a>
        </nav>
        <button type="button" id="theme-toggle"><i data-lucide="moon" aria-hidden="true"></i><span>Change Theme</span></button>
    </aside>

    <!-- Main Application Content -->
    <main class="content" id="dashboard">
        <h1>Dashboard</h1>

        <!-- Statistics -->
        <section class="stats-grid">
            <article class="stat-card">
                <h3 id="stat-workflows">0</h3>
                <p>Workflows</p>
            </article>
            <article class="stat-card">
                <h3 id="stat-runs">0</h3>
                <p>Total Runs</p>
            </article>
            <article class="stat-card">
                <h3 id="stat-success">—</h3>
                <p>Success Rate</p>
            </article>
        </section>

        <!-- Quick Actions -->
        <section class="quick-actions">
            <a href="#builder" class="btn-primary"><i data-lucide="plus" aria-hidden="true"></i> New Workflow</a>
            <a href="#templates" class="btn"><i data-lucide="layers" aria-hidden="true"></i> Browse Templates</a>
        </section>

        <!-- Recent Workflow Runs -->
        <section>
            <h2>Recent Runs</h2>
            <ul id="recent-runs" class="run-list">
                <li class="empty">
                    No runs yet — create a workflow to get started.
                </li>
            </ul>
        </section>
    </main>

    <!-- Notification Component -->
    <div
        id="notification"
        class="notification"
        role="status"
        aria-live="polite">
    </div>

    <!-- Application JavaScript -->
    <script type="module" src="src/js/app.js"></script>

</body>
</html>
