<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FlowForge - A browser-based visual workflow automation platform.">
    <title>FlowForge | Workflow Automation</title>
    <link rel="stylesheet" href="src/css/app-shell.css">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <h2>FlowForge</h2>
        <nav aria-label="Main navigation">
            <a href="#dashboard" class="active">Dashboard</a>
            <a href="#builder">Builder</a>
            <a href="#runs" data-coming-soon>Runs</a>
            <a href="#templates" data-coming-soon>Templates</a>
            <a href="#settings" data-coming-soon>Settings</a>
        </nav>
        <button type="button" id="theme-toggle">Change Theme</button>
    </aside>
    <main class="content" id="dashboard">
        <h1>Dashboard</h1>
        <section class="stats-grid">
            <article class="stat-card"><h3 id="stat-workflows">0</h3><p>Workflows</p></article>
            <article class="stat-card"><h3 id="stat-runs">0</h3><p>Total Runs</p></article>
            <article class="stat-card"><h3 id="stat-success">—</h3><p>Success Rate</p></article>
        </section>
        <section class="quick-actions">
            <a href="#builder" class="btn-primary" data-coming-soon>+ New Workflow</a>
            <a href="#templates" class="btn" data-coming-soon>Browse Templates</a>
        </section>
        <section><h2>Recent Runs</h2><ul id="recent-runs" class="run-list"><li class="empty">No runs yet — create a workflow to get started.</li></ul></section>
    </main>
    <div id="notification" class="notification" role="status" aria-live="polite"></div>
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
