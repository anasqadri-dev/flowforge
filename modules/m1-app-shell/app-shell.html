<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowForge</title>
  <link rel="stylesheet" href="app-shell.css">
</head>
<body>

  <div class="sidebar">
    <h2>Flow-Forge</h2>
    <a href="app-shell.html" class="active"  >Dashboard</a>
<a href="../mod2/builder.html">Builder</a>
<a href="../mod6/runs.html">Runs</a>
<a href="../mod8/templates.html">Templates</a>
<a href="../mod8/settings.html">Settings</a>
<button type="button" onclick="toggleTheme()">Change Theme</button>
  </div>

  <div class="content">
  <h1>Dashboard</h1>

  <div class="stats-grid">
    <div class="stat-card">
      <h3 id="stat-workflows">0</h3>
      <p>Workflows</p>
    </div>
    <div class="stat-card">
      <h3 id="stat-runs">0</h3>
      <p>Total Runs</p>
    </div>
    <div class="stat-card">
      <h3 id="stat-success">—</h3>
      <p>Success Rate</p>
    </div>
  </div>

  <div class="quick-actions">
    <a href="../mod2/builder.html" class="btn-primary">+ New Workflow</a>
    <a href="../mod8/templates.html" class="btn">Browse Templates</a>
  </div>
  <h2>Recent Runs</h2>
  <ul id="recent-runs" class="run-list">
    <li class="empty">No runs yet — create a workflow to get started.</li>
  </ul>
</div>

  <div id="notification" class="notification"></div>
  <script src="app-shell.js"></script>

</html>
